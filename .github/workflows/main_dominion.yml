name: Build and deploy ASP.Net Core app to Azure Web App - dominion

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install client dependencies
        working-directory: Dominion.Client
        run: npm ci

      - name: Build client
        working-directory: Dominion.Client
        run: npm run build

      - name: Copy client build to API wwwroot
        run: cp -r Dominion.Client/dist/* Dominion.API/wwwroot/

      - name: Build API
        run: dotnet build Dominion.API/Dominion.API.csproj --configuration Release

      - name: Publish API
        run: dotnet publish Dominion.API/Dominion.API.csproj --configuration Release --output ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'dominion'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_384F90A275AB4F7C9503A2E98F1DCF74 }}